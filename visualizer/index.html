<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Visualizer — EdgarAllanMusic</title>
  <meta name="description" content="The raven and the candle, moving with the music. EdgarAllanMusic visualizer.">
  <meta name="theme-color" content="#0b0a09">
  <meta name="color-scheme" content="dark">
  <link rel="canonical" href="https://edgarallanmusic.github.io/visualizer/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="en_US">
  <meta property="og:site_name" content="EdgarAllanMusic">
  <meta property="og:url" content="https://edgarallanmusic.github.io/visualizer/">
  <meta property="og:title" content="Visualizer — EdgarAllanMusic">
  <meta property="og:description" content="The raven and the candle, moving with the music.">
  <meta property="og:image" content="https://edgarallanmusic.github.io/assets/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A raven perched on old books beside a dripping candle.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Visualizer — EdgarAllanMusic">
  <meta name="twitter:description" content="The raven and the candle, moving with the music.">
  <meta name="twitter:image" content="https://edgarallanmusic.github.io/assets/og.jpg">
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="../assets/favicon-32.png" sizes="32x32">
  <link rel="preload" href="assets/banner.webp" as="image">
  <style>
    @font-face {
      font-family: "Cormorant Garamond";
      font-style: normal;
      font-weight: 500;
      font-display: swap;
      src: url("../assets/fonts/cormorant-garamond-500.woff2") format("woff2");
    }
    :root {
      --carbon: #0b0a09;
      --cream: #efe6d2;
      --amber: #e0a24a;
      --amber-hot: #ffd890;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      height: 100dvh;
      background: var(--carbon);
      color: var(--cream);
      overflow: hidden;
    }
    #c {
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: block;
      background: var(--carbon);
    }
    .mark {
      position: fixed;
      z-index: 3;
      top: max(0.85rem, env(safe-area-inset-top));
      left: max(0.95rem, env(safe-area-inset-left));
      color: var(--cream);
      text-decoration: none;
      font-family: "Cormorant Garamond", Palatino, Georgia, serif;
      font-size: 1.35rem;
      letter-spacing: 0.04em;
      line-height: 1;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.65);
    }
    .mark:hover, .mark:focus-visible { color: var(--amber-hot); }
    .controls {
      position: fixed;
      z-index: 3;
      left: 50%;
      bottom: max(0.75rem, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.15rem 0.2rem;
      max-width: calc(100% - 1.25rem - env(safe-area-inset-left) - env(safe-area-inset-right));
      padding: 0.3rem 0.45rem;
      border-radius: 999px;
      border: 1px solid rgba(224, 162, 74, 0.4);
      background: rgba(11, 10, 9, 0.62);
      opacity: 1;
      transition: opacity 0.45s ease;
    }
    .controls.is-idle {
      opacity: 0;
      pointer-events: none;
    }
    .controls button {
      appearance: none;
      min-width: 44px;
      min-height: 44px;
      padding: 0.4rem 0.75rem;
      border-radius: 999px;
      border: 0;
      background: transparent;
      color: var(--cream);
      font-family: "Cormorant Garamond", Palatino, Georgia, serif;
      font-size: 1.15rem;
      letter-spacing: 0.06em;
    }
    .controls button svg { display: block; }
    .controls button.is-muted .icon-on,
    .controls button:not(.is-muted) .icon-off { display: none; }
    .volume {
      display: flex;
      align-items: center;
      gap: 0.15rem;
    }
    .controls input[type="range"] {
      width: 6.5rem;
      height: 44px;
      accent-color: var(--amber);
      background: transparent;
    }
    .controls button:hover,
    .controls button:focus-visible {
      border-color: var(--amber);
      color: var(--amber-hot);
      outline: none;
    }
    .controls button[hidden] { display: none; }
    .now {
      position: fixed;
      z-index: 3;
      left: max(1rem, env(safe-area-inset-left));
      bottom: var(--bar-stack, 5.2rem);
      margin: 0;
      max-width: min(22rem, calc(100% - 2rem));
      color: var(--cream);
      font-family: "Cormorant Garamond", Palatino, Georgia, serif;
      font-size: 1.2rem;
      letter-spacing: 0.04em;
      line-height: 1.15;
      text-shadow: 0 1px 10px rgba(0, 0, 0, 0.75);
      pointer-events: none;
    }
    .now-album {
      display: block;
      color: var(--amber);
      font-size: 0.82rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .now-title { display: block; }
    .now[hidden] { display: none; }
    .now-kind {
      display: none;
      margin-bottom: 0.15rem;
      color: var(--amber);
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    .now.is-preview .now-kind { display: block; }
    .tracklist {
      position: fixed;
      inset: 0;
      z-index: 6;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      background: rgba(0, 0, 0, 0.46);
    }
    .tracklist[hidden] { display: none; }
    .tracklist-sheet {
      width: min(34rem, 100%);
      max-height: min(72vh, 40rem);
      overflow: auto;
      padding: 1rem 1rem 1.4rem;
      border: 1px solid rgba(224, 162, 74, 0.42);
      border-bottom: 0;
      border-radius: 1.1rem 1.1rem 0 0;
      background: rgba(16, 14, 12, 0.9);
      box-shadow: 0 -18px 50px rgba(0, 0, 0, 0.45);
    }
    .tracklist-sheet h2 {
      margin: 0 0 0.8rem;
      font-family: "Cormorant Garamond", Palatino, Georgia, serif;
      font-weight: 500;
      font-size: 1.8rem;
      letter-spacing: 0.04em;
    }
    .track-group { margin: 0 0 1rem; }
    .track-group h3 {
      margin: 0 0 0.35rem;
      color: var(--amber);
      font-family: "Cormorant Garamond", Palatino, Georgia, serif;
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .track {
      display: block;
      width: 100%;
      min-height: 44px;
      margin: 0;
      padding: 0.55rem 0.75rem;
      border: 0;
      border-left: 2px solid transparent;
      background: transparent;
      color: var(--cream);
      font-family: "Cormorant Garamond", Palatino, Georgia, serif;
      font-size: 1.15rem;
      letter-spacing: 0.02em;
      text-align: left;
    }
    .track.is-current {
      border-left-color: #ffd890;
      background: rgba(107, 26, 36, 0.55);
      color: #fff6e4;
    }
    .track:hover,
    .track:focus-visible {
      background: rgba(224, 162, 74, 0.14);
      outline: none;
    }
    @media (max-width: 900px) {
      .controls {
        width: min(36rem, calc(100vw - 1rem - env(safe-area-inset-left) - env(safe-area-inset-right)));
      }
      .controls input[type="range"] { width: 4.75rem; }
    }
    @media (min-width: 800px) {
      .tracklist { align-items: center; padding: 1.5rem; }
      .tracklist-sheet {
        border-bottom: 1px solid rgba(224, 162, 74, 0.42);
        border-radius: 1rem;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .controls { transition: none; }
    }
  </style>
  <link rel="stylesheet" href="../css/cursor.css">
  <link rel="stylesheet" href="../css/transition.css">
</head>
<body data-cursor-trail="off">
  <canvas id="c" aria-label="Raven and candle, moving with the music"></canvas>
  <a class="mark" href="../index.html">EdgarAllanMusic</a>
  <p id="now-playing" class="now" hidden>
    <span id="now-kind" class="now-kind">Preview</span>
    <span id="now-album" class="now-album"></span>
    <span id="now-title" class="now-title"></span>
  </p>
  <audio id="track" preload="none"></audio>
  <div id="controls" class="controls">
    <button type="button" id="prev" hidden disabled aria-label="Previous track">Prev</button>
    <button type="button" id="play" hidden disabled aria-pressed="false">Play</button>
    <button type="button" id="next" hidden disabled aria-label="Next track">Next</button>
    <button type="button" id="list-toggle" hidden disabled aria-expanded="false" aria-controls="tracklist" aria-label="Track list">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M4 6h16v1.6H4V6zm0 5.2h16v1.6H4v-1.6zM4 16.4h10v1.6H4v-1.6z"/>
      </svg>
    </button>
    <div class="volume">
      <button type="button" id="mute" aria-label="Mute" aria-pressed="false">
        <svg class="icon-on" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M4 9h3.2L12 5.2v13.6L7.2 15H4V9zm10.2 1.1a3.2 3.2 0 0 1 0 3.8l-1.1-.9a1.7 1.7 0 0 0 0-2l1.1-.9zm2.3-2.2a6.2 6.2 0 0 1 0 8.2l-1.1-.9a4.7 4.7 0 0 0 0-6.4l1.1-.9z"/>
        </svg>
        <svg class="icon-off" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M4 9h3.2L12 5.2v13.6L7.2 15H4V9zm12.1 1.2 2.4 2.4 2.4-2.4 1.1 1.1-2.4 2.4 2.4 2.4-1.1 1.1-2.4-2.4-2.4 2.4-1.1-1.1 2.4-2.4-2.4-2.4 1.1-1.1z"/>
        </svg>
      </button>
      <input id="volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume">
    </div>
    <button type="button" id="full" aria-pressed="false">Fullscreen</button>
  </div>
  <div id="tracklist" class="tracklist" hidden>
    <div class="tracklist-sheet" role="dialog" aria-modal="true" aria-labelledby="tracklist-title">
      <h2 id="tracklist-title">The shelf</h2>
      <div id="tracklist-body"></div>
    </div>
  </div>
  <script src="visualizer.js"></script>
  <script src="../js/transition.js"></script>
</body>
</html>
